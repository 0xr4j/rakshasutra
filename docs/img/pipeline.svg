<text x="20" y="226" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#6A6F85">3,000 wristbands in one gateway cell: 57.6% of frames lost with one uplink per arrival, 21.3% with chunks and the Bloom heartbeat (calculated)</text></svg>
